[package]
name = "sdbr"
path = "src/main.rs"
version = "0.1.0"
edition = "2024"
description = "A small CLI that tracks where your git branches forked from and where they merge back to."
license = "MIT"
repository = "https://github.com/Super-Duper-Software/super-duper-brancher"
readme = "README.md"
keywords = ["git", "branch", "cli", "hook"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

